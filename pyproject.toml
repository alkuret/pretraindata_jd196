[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alkuret-pretraindata_jd196"
version = "0.1.0"
description = "在同一个输入里两两比对，检测预训练数据工程师·知识库的时效性维护相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alkuret" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alkuret.github.io"
Repository = "https://github.com/alkuret/pretraindata_jd196"
Issues = "https://github.com/alkuret/pretraindata_jd196/issues"

[project.scripts]
pretraindata_jd196 = "pretraindata_jd196:main"

[tool.setuptools]
py-modules = ["pretraindata_jd196"]
